[project]
name = "flight-finder"
version = "0.1.0"
description = "Watches flight prices for planned trips and emails when they drop"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.15.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flight-finder = "flight_finder:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
